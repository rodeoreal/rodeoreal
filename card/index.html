<script>
  // 휴대폰 글자 크기 설정과 관계없이 로고·번호를 한 줄로 화면 폭에 맞춤.

  // 계산된 크기를 다시 읽지 않고 직접 지정한 값(cur)을 비율대로 줄여 나간다.
  function fit() {
    document.querySelectorAll('[data-fit]').forEach(function (el) {
      el.style.fontSize = '';
      var cur = parseFloat(getComputedStyle(el).fontSize);
      for (var i = 0; i < 8 && el.scrollWidth > el.clientWidth + 0.5; i++) {
        cur = cur * el.clientWidth / el.scrollWidth * 0.97;
        el.style.fontSize = cur + 'px';
      }
    });
    var grid = document.querySelector('.grid');
    grid.classList.remove('two');
    var over = Array.prototype.some.call(grid.children, function (a) { return a.scrollWidth > a.clientWidth; });
    if (over) grid.classList.add('two');
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('on');
    setTimeout(function () { t.classList.remove('on'); }, 2200);
  }

  document.getElementById('share').addEventListener('click', function () {
    var url = location.href;
    if (navigator.share) {
      navigator.share({ title: '로데오부동산 류재철', text: '로데오부동산 대표 공인중개사 류재철 010-8981-0202', url: url }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () { toast('명함 링크가 복사되었습니다'); });
    } else {
      prompt('아래 링크를 복사하세요', url);
    }
  });
</script>
