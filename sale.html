<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매매 물건 관리 - 화정동로데오부동산</title>
    <link rel="stylesheet" href="/rodeoreal/css/common.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        .calculator {
            background: linear-gradient(135deg, var(--naver-green) 0%, var(--naver-green-dark) 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }
        
        .calculator-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }
        
        .calculator-icon {
            margin-right: 8px;
            font-size: 20px;
        }
        
        .calculator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        
        .calc-input-group {
            display: flex;
            flex-direction: column;
        }
        
        .calc-label {
            font-size: 13px;
            margin-bottom: 6px;
            opacity: 0.9;
        }
        
        .calc-input {
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
        }
        
        .calc-result {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        
        .calc-result-inner {
            width: 100%;
        }
        
        .calc-result-label {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 4px;
        }
        
        .calc-result-value {
            font-size: 24px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="/rodeoreal/images/logo.png" alt="화정동로데오부동산" class="sidebar-logo">
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home nav-icon"></i>
                    <span>대시보드</span>
                </a>
                <a href="rental.html" class="nav-item">
                    <i class="fas fa-building nav-icon"></i>
                    <span>임대 물건</span>
                </a>
                <a href="sale.html" class="nav-item active">
                    <i class="fas fa-store nav-icon"></i>
                    <span>매매 물건</span>
                </a>
                <a href="customers.html" class="nav-item">
                    <i class="fas fa-users nav-icon"></i>
                    <span>손님(내방) 관리</span>
                </a>
                <a href="settings.html" class="nav-item" id="settingsNav" style="display: none;">
                    <i class="fas fa-cog nav-icon"></i>
                    <span>설정</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar"><span id="userInitial">U</span></div>
                    <div>
                        <div class="user-name" style="font-weight: 600;">사용자</div>
                        <div class="user-role" style="font-size: 12px; color: var(--text-secondary);">직원</div>
                    </div>
                </div>
                <button class="logout-btn">로그아웃</button>
            </div>
        </aside>
        
        <!-- 메인 컨텐츠 -->
        <main class="main-content">
            <div class="topbar">
                <button class="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="page-title">매매 물건 관리</h1>
                <div class="topbar-actions">
                    <button class="btn btn-secondary btn-sm" onclick="exportData()">
                        <i class="fas fa-download"></i> 내보내기
                    </button>
                    <button class="btn btn-primary btn-sm" onclick="openAddModal()">
                        <i class="fas fa-plus"></i> 물건 등록
                    </button>
                </div>
            </div>
            
            <div class="content-area">
                <!-- 수익률 계산기 -->
                <div class="calculator">
                    <div class="calculator-title">
                        <i class="fas fa-calculator calculator-icon"></i>
                        수익률 계산기
                    </div>
                    <div class="calculator-grid">
                        <div class="calc-input-group">
                            <label class="calc-label">매매가 (만원)</label>
                            <input type="number" id="calcSalePrice" class="calc-input" placeholder="0" oninput="calculateYield()">
                        </div>
                        <div class="calc-input-group">
                            <label class="calc-label">보증금 (만원)</label>
                            <input type="number" id="calcDeposit" class="calc-input" placeholder="0" oninput="calculateYield()">
                        </div>
                        <div class="calc-input-group">
                            <label class="calc-label">월세 (만원)</label>
                            <input type="number" id="calcMonthlyRent" class="calc-input" placeholder="0" oninput="calculateYield()">
                        </div>
                        <div class="calc-result">
                            <div class="calc-result-inner">
                                <div class="calc-result-label">연 수익</div>
                                <div class="calc-result-value" id="calcAnnualIncome">0원</div>
                            </div>
                        </div>
                        <div class="calc-result">
                            <div class="calc-result-inner">
                                <div class="calc-result-label">수익률</div>
                                <div class="calc-result-value" id="calcYieldRate">0%</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 검색 및 필터 -->
                <div class="card">
                    <div class="search-filters">
                        <input type="text" id="searchInput" class="search-input" placeholder="물건지, 건물명, 상호로 검색...">
                        <select id="statusFilter" class="filter-select">
                            <option value="">전체 상태</option>
                            <option value="접수">접수</option>
                            <option value="진행중">진행중</option>
                            <option value="계약완료">계약완료</option>
                            <option value="보류">보류</option>
                        </select>
                        <select id="yieldFilter" class="filter-select">
                            <option value="">전체 수익률</option>
                            <option value="5">5% 이상</option>
                            <option value="7">7% 이상</option>
                            <option value="10">10% 이상</option>
                        </select>
                    </div>
                </div>
                
                <!-- 물건 목록 -->
                <div class="card">
                    <div class="table-container">
                        <table id="saleTable">
                            <thead>
                                <tr>
                                    <th>물건지</th>
                                    <th>건물명</th>
                                    <th>현재상호</th>
                                    <th>층</th>
                                    <th>분양면적(평)</th>
                                    <th>실면적(평)</th>
                                    <th>매매가</th>
                                    <th>보증금</th>
                                    <th>월세</th>
                                    <th>수익률</th>
                                    <th>접수일</th>
                                    <th>상태</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="saleTableBody">
                                <tr>
                                    <td colspan="13" style="text-align: center; padding: 40px;">
                                        <div class="spinner"></div>
                                        데이터를 불러오는 중...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 등록/수정 모달 -->
    <div id="saleModal" class="modal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">매매 물건 등록</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="saleForm">
                    <input type="hidden" id="propertyId">
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label class="form-label" for="address">물건지 (주소) *</label>
                            <input type="text" id="address" class="form-input" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="buildingName">건물명 *</label>
                            <input type="text" id="buildingName" class="form-input" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="currentStore">현재상호</label>
                            <input type="text" id="currentStore" class="form-input">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="receivedDate">접수일자 *</label>
                            <input type="date" id="receivedDate" class="form-input" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="floor">층 *</label>
                            <input type="text" id="floor" class="form-input" required placeholder="예: 1층, 지하1층">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="contractArea">분양면적 (평) *</label>
                            <input type="number" id="contractArea" class="form-input" step="0.1" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="actualArea">실면적 (평) *</label>
                            <input type="number" id="actualArea" class="form-input" step="0.1" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="contact">연락처</label>
                            <input type="tel" id="contact" class="form-input" placeholder="010-0000-0000">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="salePrice">매매가 (만원) *</label>
                            <input type="number" id="salePrice" class="form-input" required oninput="autoCalculateYield()">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="deposit">보증금 (만원) *</label>
                            <input type="number" id="deposit" class="form-input" required oninput="autoCalculateYield()">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="monthlyRent">월세 (만원) *</label>
                            <input type="number" id="monthlyRent" class="form-input" required oninput="autoCalculateYield()">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="yieldRate">수익률 (%)</label>
                            <input type="number" id="yieldRate" class="form-input" step="0.01" readonly style="background-color: #F8F9FA;">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="status">진행상태 *</label>
                            <select id="status" class="form-input" required>
                                <option value="접수">접수</option>
                                <option value="진행중">진행중</option>
                                <option value="계약완료">계약완료</option>
                                <option value="보류">보류</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="notes">비고</label>
                        <textarea id="notes" class="form-input" rows="4" placeholder="추가 정보나 특이사항을 입력하세요"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">사진</label>
                        <input type="file" id="photoUpload" accept="image/*" multiple style="display: none;">
                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('photoUpload').click()">
                            <i class="fas fa-camera"></i> 사진 추가
                        </button>
                        <div id="photoPreview" style="margin-top: 12px;"></div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">첨부파일</label>
                        <input type="file" id="fileUpload" multiple style="display: none;">
                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('fileUpload').click()">
                            <i class="fas fa-paperclip"></i> 파일 추가
                        </button>
                        <div id="fileList" style="margin-top: 12px;"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button>
                <button type="button" class="btn btn-primary" onclick="saveProperty()">저장</button>
            </div>
        </div>
    </div>

    <!-- 상세보기 모달 -->
    <div id="detailModal" class="modal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h2 class="modal-title">물건 상세정보</h2>
                <button class="modal-close" onclick="Modal.close('detailModal')">&times;</button>
            </div>
            <div class="modal-body" id="detailContent">
                <!-- 상세 내용이 동적으로 삽입됩니다 -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="Modal.close('detailModal')">닫기</button>
            </div>
        </div>
    </div>

    <script src="/rodeoreal/images/logo.png"></script>
    <script src="/rodeoreal/js/sale.js"></script>
</body>
</html>
