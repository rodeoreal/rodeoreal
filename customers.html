<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>손님(내방) 관리 - 화정동로데오부동산</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="./images/logo.png" alt="화정동로데오부동산" class="sidebar-logo">
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home nav-icon"></i>
                    <span>대시보드</span>
                </a>
                <a href="rental.html" class="nav-item">
                    <i class="fas fa-building nav-icon"></i>
                    <span>임대 물건</span>
                </a>
                <a href="sale.html" class="nav-item">
                    <i class="fas fa-store nav-icon"></i>
                    <span>매매 물건</span>
                </a>
                <a href="customers.html" class="nav-item active">
                    <i class="fas fa-users nav-icon"></i>
                    <span>손님(내방) 관리</span>
                </a>
                <a href="settings.html" class="nav-item" id="settingsNav" style="display: none;">
                    <i class="fas fa-cog nav-icon"></i>
                    <span>설정</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar"><span id="userInitial">U</span></div>
                    <div>
                        <div class="user-name" style="font-weight: 600;">사용자</div>
                        <div class="user-role" style="font-size: 12px; color: var(--text-secondary);">직원</div>
                    </div>
                </div>
                <button class="logout-btn">로그아웃</button>
            </div>
        </aside>
        
        <!-- 메인 컨텐츠 -->
        <main class="main-content">
            <div class="topbar">
                <button class="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="page-title">손님(내방) 관리</h1>
                <div class="topbar-actions">
                    <button class="btn btn-secondary btn-sm" onclick="exportData()">
                        <i class="fas fa-download"></i> 내보내기
                    </button>
                    <button class="btn btn-primary btn-sm" onclick="openAddModal()">
                        <i class="fas fa-plus"></i> 손님 등록
                    </button>
                </div>
            </div>
            
            <div class="content-area">
                <!-- 검색 및 필터 -->
                <div class="card">
                    <div class="search-filters">
                        <input type="text" id="searchInput" class="search-input" placeholder="찾는물건, 연락처로 검색...">
                        <select id="statusFilter" class="filter-select">
                            <option value="">전체 상태</option>
                            <option value="대기">대기</option>
                            <option value="진행중">진행중</option>
                            <option value="계약완료">계약완료</option>
                            <option value="포기">포기</option>
                        </select>
                        <input type="date" id="dateFilter" class="filter-select" placeholder="방문일">
                    </div>
                </div>
                
                <!-- 손님 목록 -->
                <div class="card">
                    <div class="table-container">
                        <table id="customerTable">
                            <thead>
                                <tr>
                                    <th>방문(내전)일자</th>
                                    <th>찾는물건(업종)</th>
                                    <th>연락처</th>
                                    <th>특이사항</th>
                                    <th>상태</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="customerTableBody">
                                <tr>
                                    <td colspan="6" style="text-align: center; padding: 40px;">
                                        <div class="spinner"></div>
                                        데이터를 불러오는 중...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 등록/수정 모달 -->
    <div id="customerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">손님 등록</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="customerForm">
                    <input type="hidden" id="customerId">
                    
                    <div class="form-group">
                        <label class="form-label" for="visitDate">방문(내전)일자 *</label>
                        <input type="date" id="visitDate" class="form-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="lookingFor">찾는물건(업종) *</label>
                        <input type="text" id="lookingFor" class="form-input" required placeholder="예: 카페, 음식점, 편의점 등">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="contact">연락처 *</label>
                        <input type="tel" id="contact" class="form-input" required placeholder="010-0000-0000">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="specialNotes">특이사항</label>
                        <input type="text" id="specialNotes" class="form-input" placeholder="예: 1층 선호, 주차 필수 등">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="status">상태 *</label>
                        <select id="status" class="form-input" required>
                            <option value="대기">대기</option>
                            <option value="진행중">진행중</option>
                            <option value="계약완료">계약완료</option>
                            <option value="포기">포기</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="memo">비고</label>
                        <textarea id="memo" class="form-input" rows="4" placeholder="추가 정보나 메모를 입력하세요"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button>
                <button type="button" class="btn btn-primary" onclick="saveCustomer()">저장</button>
            </div>
        </div>
    </div>

    <!-- 상세보기 모달 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">손님 상세정보</h2>
                <button class="modal-close" onclick="Modal.close('detailModal')">&times;</button>
            </div>
            <div class="modal-body" id="detailContent">
                <!-- 상세 내용이 동적으로 삽입됩니다 -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="Modal.close('detailModal')">닫기</button>
            </div>
        </div>
    </div>

    <script src="./js/common.js"></script>
    <script src="./js/customers.js"></script>
</body>
</html>
