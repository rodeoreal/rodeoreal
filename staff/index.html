
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - 화정동로데오부동산</title>
    <link rel="stylesheet" href="/rodeoreal/css/common.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, var(--naver-green) 0%, var(--naver-green-dark) 100%);
            color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
        }
        
        .stat-card.secondary {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
        }
        
        .stat-card.tertiary {
            background: linear-gradient(135deg, #FF9500 0%, #E68500 100%);
        }
        
        .stat-card.quaternary {
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
        }
        
        .stat-icon {
            float: right;
            font-size: 40px;
            opacity: 0.3;
        }
        
        .recent-list {
            list-style: none;
        }
        
        .recent-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .recent-item:last-child {
            border-bottom: none;
        }
        
        .recent-info {
            flex: 1;
        }
        
        .recent-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .recent-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="/rodeoreal/images/logo.png" alt="화정동로데오부동산" class="sidebar-logo">
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item active">
                    <i class="fas fa-home nav-icon"></i>
                    <span>대시보드</span>
                </a>
                <a href="rental.html" class="nav-item">
                    <i class="fas fa-building nav-icon"></i>
                    <span>임대 물건</span>
                </a>
                <a href="sale.html" class="nav-item">
                    <i class="fas fa-store nav-icon"></i>
                    <span>매매 물건</span>
                </a>
                <a href="customers.html" class="nav-item">
                    <i class="fas fa-users nav-icon"></i>
                    <span>손님(내방) 관리</span>
                </a>
                <a href="settings.html" class="nav-item" id="settingsNav" style="display: none;">
                    <i class="fas fa-cog nav-icon"></i>
                    <span>설정</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar"><span id="userInitial">U</span></div>
                    <div>
                        <div class="user-name" style="font-weight: 600;">사용자</div>
                        <div class="user-role" style="font-size: 12px; color: var(--text-secondary);">직원</div>
                    </div>
                </div>
                <button class="logout-btn">로그아웃</button>
            </div>
        </aside>
        
        <!-- 메인 컨텐츠 -->
        <main class="main-content">
            <div class="topbar">
                <button class="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="page-title">대시보드</h1>
                <div class="topbar-actions">
                    <span id="currentDate" style="color: var(--text-secondary);"></span>
                </div>
            </div>
            
            <div class="content-area">
                <!-- 통계 카드 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <i class="fas fa-building stat-icon"></i>
                        <div class="stat-label">임대 물건</div>
                        <div class="stat-value" id="rentalCount">0</div>
                    </div>
                    <div class="stat-card secondary">
                        <i class="fas fa-store stat-icon"></i>
                        <div class="stat-label">매매 물건</div>
                        <div class="stat-value" id="saleCount">0</div>
                    </div>
                    <div class="stat-card tertiary">
                        <i class="fas fa-users stat-icon"></i>
                        <div class="stat-label">손님(내방)</div>
                        <div class="stat-value" id="customerCount">0</div>
                    </div>
                    <div class="stat-card quaternary">
                        <i class="fas fa-calendar-check stat-icon"></i>
                        <div class="stat-label">오늘 접수</div>
                        <div class="stat-value" id="todayCount">0</div>
                    </div>
                </div>
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px;">
                    <!-- 최근 임대 물건 -->
                    <div class="card">
                        <h2 class="card-title">최근 임대 물건</h2>
                        <ul class="recent-list" id="recentRentals">
                            <li class="empty-state">
                                <div class="empty-state-icon">📦</div>
                                <div class="empty-state-text">등록된 임대 물건이 없습니다</div>
                            </li>
                        </ul>
                        <a href="rental.html" class="btn btn-secondary" style="width: 100%; margin-top: 16px;">
                            전체 보기
                        </a>
                    </div>
                    
                    <!-- 최근 매매 물건 -->
                    <div class="card">
                        <h2 class="card-title">최근 매매 물건</h2>
                        <ul class="recent-list" id="recentSales">
                            <li class="empty-state">
                                <div class="empty-state-icon">🏪</div>
                                <div class="empty-state-text">등록된 매매 물건이 없습니다</div>
                            </li>
                        </ul>
                        <a href="sale.html" class="btn btn-secondary" style="width: 100%; margin-top: 16px;">
                            전체 보기
                        </a>
                    </div>
                    
                    <!-- 최근 손님 -->
                    <div class="card">
                        <h2 class="card-title">최근 손님(내방)</h2>
                        <ul class="recent-list" id="recentCustomers">
                            <li class="empty-state">
                                <div class="empty-state-icon">👥</div>
                                <div class="empty-state-text">등록된 손님이 없습니다</div>
                            </li>
                        </ul>
                        <a href="customers.html" class="btn btn-secondary" style="width: 100%; margin-top: 16px;">
                            전체 보기
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/rodeoreal/js/common.js"></script>
    <script>
        // 인증 확인
        Auth.requireAuth();
        
        // 관리자인 경우 설정 메뉴 표시
        if (Auth.isAdmin()) {
            document.getElementById('settingsNav').style.display = 'flex';
        }
        
        // 현재 날짜 표시
        document.getElementById('currentDate').textContent = formatDate(new Date());
        
        // 사용자 정보 표시
        const user = Auth.getCurrentUser();
        if (user) {
            document.getElementById('userInitial').textContent = user.name.charAt(0);
        }
        
        // 데이터 로드
        async function loadDashboard() {
            try {
                // 임대 물건
                const rentals = await API.get('rental_properties', { limit: 5, sort: '-created_at' });
                document.getElementById('rentalCount').textContent = rentals.total || 0;
                
                if (rentals.data && rentals.data.length > 0) {
                    const recentList = document.getElementById('recentRentals');
                    recentList.innerHTML = rentals.data.slice(0, 5).map(item => `
                        <li class="recent-item">
                            <div class="recent-info">
                                <div class="recent-title">${item.store_name || '상호 미정'}</div>
                                <div class="recent-meta">${item.building_name} · ${item.business_type || ''}</div>
                            </div>
                            ${getStatusBadge(item.status || '접수')}
                        </li>
                    `).join('');
                }
                
                // 매매 물건
                const sales = await API.get('sale_properties', { limit: 5, sort: '-created_at' });
                document.getElementById('saleCount').textContent = sales.total || 0;
                
                if (sales.data && sales.data.length > 0) {
                    const recentList = document.getElementById('recentSales');
                    recentList.innerHTML = sales.data.slice(0, 5).map(item => `
                        <li class="recent-item">
                            <div class="recent-info">
                                <div class="recent-title">${item.current_store || item.address}</div>
                                <div class="recent-meta">${item.building_name} · ${formatCurrency(item.sale_price || 0)}</div>
                            </div>
                            ${getStatusBadge(item.status || '접수')}
                        </li>
                    `).join('');
                }
                
                // 손님(내방)
                const customers = await API.get('customers', { limit: 5, sort: '-created_at' });
                document.getElementById('customerCount').textContent = customers.total || 0;
                
                if (customers.data && customers.data.length > 0) {
                    const recentList = document.getElementById('recentCustomers');
                    recentList.innerHTML = customers.data.slice(0, 5).map(item => `
                        <li class="recent-item">
                            <div class="recent-info">
                                <div class="recent-title">${item.looking_for}</div>
                                <div class="recent-meta">${formatDate(item.visit_date)} · ${item.contact || ''}</div>
                            </div>
                            ${getStatusBadge(item.status || '대기')}
                        </li>
                    `).join('');
                }
                
                // 오늘 접수 건수
                const today = new Date().toISOString().split('T')[0];
                const todayRentals = rentals.data?.filter(r => r.received_date?.startsWith(today)).length || 0;
                const todaySales = sales.data?.filter(s => s.received_date?.startsWith(today)).length || 0;
                const todayCustomers = customers.data?.filter(c => c.visit_date?.startsWith(today)).length || 0;
                document.getElementById('todayCount').textContent = todayRentals + todaySales + todayCustomers;
                
            } catch (error) {
                console.error('Dashboard load error:', error);
                Toast.error('데이터를 불러오는 중 오류가 발생했습니다.');
            }
        }
        
        loadDashboard();
    </script>
</body>
</html>
