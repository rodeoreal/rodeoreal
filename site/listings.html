<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매물 보기 | 로데오부동산</title>
<meta name="description" content="화정동 상가·점포 임대 매물 목록. 층, 보증금, 월세, 면적, 무권리 조건으로 찾아보세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="매물 보기 | 로데오부동산">
<meta property="og:description" content="화정동 상가·점포 임대 매물 목록. 층, 보증금, 월세, 면적, 무권리 조건으로 찾아보세요.">
<meta property="og:image" content="images/og.jpg">
<meta property="og:locale" content="ko_KR">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="listings">
<main>
<section>
  <div class="wrap">
    <h1>매물 보기</h1>
    <p class="updated" id="updated"></p>
    <form id="filters" class="filters" onsubmit="return false">
      <label>층
        <select name="floor"><option value="">전체</option><option value="1">1층</option><option value="2">2층</option><option value="3">3층 이상</option></select>
      </label>
      <label>보증금 상한(만원)
        <input name="maxDeposit" type="number" inputmode="numeric" min="0" step="500" placeholder="예: 5000">
      </label>
      <label>월세 상한(만원)
        <input name="maxRent" type="number" inputmode="numeric" min="0" step="10" placeholder="예: 300">
      </label>
      <label>전용 최소(평)
        <input name="minArea" type="number" inputmode="numeric" min="0" step="5" placeholder="예: 20">
      </label>
      <label>정렬
        <select name="sort"><option value="recent">최근 등록순</option><option value="rent">월세 낮은순</option><option value="deposit">보증금 낮은순</option><option value="area">면적 넓은순</option></select>
      </label>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label class="check"><input type="checkbox" name="free"> 무권리만</label>
        <label class="check"><input type="checkbox" name="urgent"> 급매만</label>
      </div>
    </form>
    <div class="result-count">검색 결과 <b id="count"></b> · <button type="reset" form="filters" class="btn btn-line" style="min-height:32px;padding:0 10px;font-size:13px">조건 초기화</button></div>
    <div class="grid" id="list"></div>
  </div>
</section>
</main>
<script src="assets/app.js"></script>
</body>
</html>
